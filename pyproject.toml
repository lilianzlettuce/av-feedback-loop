[project]
name = "loopdsp"
version = "0.1.0"
description = "Image <-> audio feedback loop: DSP core for project"
readme = "README.md"
authors = [
    { name = "lettuce", email = "57018651+lilianzlettuce@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "opencv-python>=5.1.0.95",
    "pyroomacoustics>=0.10.1",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopdsp"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
